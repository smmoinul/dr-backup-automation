# Copy to config.yaml and set real paths. config.yaml is gitignored.

source_paths:
  - /srv/app-config
  - /srv/db-dumps

destination_root: /mnt/backup-dr

schedule:
  full_backup_day: Sunday   # Monday..Sunday
  retention_days: 30

rpo_target_hours: 24

alerting:
  email:
    enabled: true
    smtp_host: smtp.gmail.com
    smtp_port: 587
    from_address: alerts@example.com
    to_address: your_email@example.com
    username: "${SMTP_USER}"
    password: "${SMTP_PASSWORD}"
